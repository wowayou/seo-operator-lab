<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Agent Run Harness | SEO Operator Lab</title>
    <style>
      body {
        margin: 0;
        font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #10221f;
        color: #e6f2ef;
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 12px;
        color: #8fb3ac;
      }
      #agent-status {
        display: inline-block;
        border: 1px solid #2a4b45;
        border-radius: 999px;
        padding: 2px 12px;
        margin-bottom: 12px;
      }
      #agent-status[data-state='error'] {
        border-color: #a8443c;
        color: #f0a9a2;
      }
      #agent-output {
        white-space: pre-wrap;
        border: 1px solid #2a4b45;
        border-radius: 6px;
        padding: 12px;
        min-height: 160px;
      }
      iframe {
        width: 100%;
        height: 320px;
        border: 1px solid #2a4b45;
        border-radius: 6px;
        margin-top: 12px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Agent Run Harness</h1>
    <p>Dev-server only. Vite bundles just the root index.html, so this page and the reference policies never reach the published site.</p>
    <div id="agent-status" role="status" data-state="booting">Loading</div>
    <pre id="agent-output">No run yet.</pre>
    <iframe id="agent-runtime" title="Agent benchmark runtime"></iframe>
    <script type="module" src="/src/agent/run.ts"></script>
  </body>
</html>
